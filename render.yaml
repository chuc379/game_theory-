services:
  # Socket.io Gateway Server
  - type: web
    name: game-theory-gateway
    runtime: python
    plan: free
    buildCommand: cd BE && pip install -r requirements.txt
    startCommand: cd BE && python src/app.py
    envVars:
      # Secrets are NOT stored in git. `sync: false` makes Render prompt for the
      # value in the dashboard and keep it out of this file.
      - key: REDIS_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      # Render generates a strong random signing key for MC JWTs.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "720"
      # Single MC account. Generate the hash with:
      #   python -m src.modules.auth.hash_cli "your-password"
      - key: MC_USERNAME
        sync: false
      - key: MC_PASSWORD_HASH
        sync: false
      # Comma separated allowlist, or "*" to allow every origin.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SOCKET_IO_PORT
        value: "5000"
      - key: PYTHON_VERSION
        value: "3.11.11"
    autoDeploy: true
    healthCheckPath: /health

  # Game Worker (Background Job)
  - type: worker
    name: game-theory-worker
    runtime: python
    plan: free
    buildCommand: cd BE && pip install -r requirements.txt
    startCommand: cd BE && python -m src.worker.game_worker
    envVars:
      - key: REDIS_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: WORKER_PORT
        value: "5001"
      - key: PYTHON_VERSION
        value: "3.11.11"
    autoDeploy: true

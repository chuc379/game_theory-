version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: game_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: game_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: game
      RABBITMQ_DEFAULT_PASS: game
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  socket-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: game_socket_gateway
    ports:
      - "5000:5000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: game
      RABBITMQ_PASSWORD: game
      SOCKET_IO_PORT: 5000
      ENV: production
      DEBUG: false
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./config:/app/config

  game-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: game_worker
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: game
      RABBITMQ_PASSWORD: game
      WORKER_PORT: 5001
      ENV: production
      DEBUG: false
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./config:/app/config

volumes:
  redis_data:
  rabbitmq_data:

networks:
  default:
    name: game_network
